[project]
name = "mahjong-robot"
version = "0.1.0"
description = "Single-arm YAM system that plays one seat of simplified Chinese Mahjong"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.2,<4",
    "scipy>=1.12",
    "pillow>=10",
    "opencv-python-headless>=4.10",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
mahjong-robot = "mahjong_robot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mahjong_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running checks (training, benchmarks, physics)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
