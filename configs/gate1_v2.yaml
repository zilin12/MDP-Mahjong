# Gate 1, second attempt: imitation warm start, then PPO fine-tuning in the league.
# Changes from gate1.yaml: start from the imitation policy, a KL penalty toward it that
# relaxes over training, a deal-in penalty, a constant exploration bonus, a gentler
# learning-rate decay, GPU updates, and fresh training seeds.
run_dir: runs/gate1_v2/ppo
init_checkpoint: runs/gate1_v2/imitation.pt
seed: 1
workers: 20
hands_per_iter: 4096
iterations: 150
train_seed_iteration_offset: 400
lr: 0.0001
lr_final_frac: 0.3
epochs: 4
minibatch_episodes: 256
clip: 0.2
vf_coef: 0.5
ent_coef: 0.005
ent_coef_final: 0.005
kl_ref_coef: 0.1
kl_ref_coef_final: 0.02
max_grad_norm: 0.5
gamma: 1.0
lam: 0.95
shaping: 0.5
dealin_penalty: 0.2
hidden: 256
val_every: 5
val_hands: 2000
val_opponents: [heuristic]
select_from_stage: 0
snapshot_every: 10
league_size: 8
torch_threads: 8
device: cuda
stages:
  - name: league
    opponents: [heuristic]
    league_prob: 0.4
